<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen Image Studio</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#10151c;color:#edf2f7}*{box-sizing:border-box}body{max-width:1200px;margin:auto;padding:32px 24px 64px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:clamp(28px,5vw,44px);letter-spacing:-1.5px;margin:8px 0}h2{font-size:23px;margin-top:44px}.subtle{color:#a8b7c9}a{color:#9ddccf}#status{border:1px solid #37504b;padding:6px 12px;border-radius:30px;font-size:14px;white-space:nowrap}form{background:#19212c;border:1px solid #2d3a4a;padding:24px;border-radius:16px}label{display:block;margin-bottom:8px}textarea,input,select,button{font:inherit;border-radius:8px;padding:10px 12px;border:1px solid #405166;background:#10151c;color:inherit}textarea{width:100%;min-height:112px;resize:vertical}.controls{display:flex;align-items:end;flex-wrap:wrap;gap:16px;margin-top:16px}.controls label{font-size:14px;margin:0}.controls input{width:120px}.controls select,.controls input{display:block;margin-top:6px}button{background:#a5e6d5;color:#102b25;border:0;font-weight:650;cursor:pointer;padding:12px 24px}button:disabled{opacity:.55;cursor:wait}#message{margin:12px 0 0}#result img{display:block;width:min(100%,768px);height:auto;border-radius:12px;margin:24px 0 12px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px}article{background:#19212c;border:1px solid #2d3a4a;border-radius:14px;overflow:hidden}article img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:repeating-conic-gradient(#25303a 0% 25%,#1b242d 0% 50%) 50%/24px 24px}article .detail{padding:18px}article h3{margin:0 0 8px;font-size:18px}article p{font-size:14px;margin:8px 0;color:#b4c3d5}footer{margin-top:40px;font-size:14px;color:#a8b7c9}@media(max-width:600px){header{align-items:start;flex-direction:column;gap:8px}body{padding:20px 16px}form{padding:18px}}
</style>
</head>
<body>
<header><div><h1>Qwen Image Studio</h1><p class="subtle">Create something worth a closer look.</p></div><span id="status">Checking model…</span></header>
<h2>Create an image</h2>
<form id="form">
<label for="prompt">Describe your image</label><textarea id="prompt" required maxlength="16000" placeholder="A tiny observatory on a mossy island, warm evening light, intricate miniature photography"></textarea>
<div class="controls"><label>Size<select id="size"><option value="1024">1024 × 1024</option><option value="2048">2048 × 2048</option></select></label><label>Steps<input id="steps" type="number" min="1" max="100" value="40" required></label><label>Seed (optional)<input id="seed" type="number" min="0" max="2147483647" placeholder="Random"></label><button id="submit" type="submit">Generate image</button></div>
<p id="message" role="status" aria-live="polite" class="subtle">Images are generated one at a time. Larger images take longer.</p>
</form>
<div id="result"></div>
<h2>Sample gallery</h2><div id="gallery" class="gallery"><p class="subtle">Samples are being prepared.</p></div>
<footer>Qwen Image 2.1 · <a href="/docs">API documentation</a></footer>
<script>
const $=id=>document.getElementById(id);let resultURL;
async function refreshStatus(){try{const r=await fetch('/health');const d=await r.json();$('status').textContent=r.ok?(d.busy?'Generating an image':'Model ready'):'Model loading';}catch{$('status').textContent='Server unavailable';}}
refreshStatus();setInterval(refreshStatus,10000);
async function gallery(){try{const r=await fetch('/samples/index.json',{cache:'no-store'});const samples=await r.json();if(!samples.length)return;$('gallery').replaceChildren();for(const s of samples){const article=document.createElement('article');const image=document.createElement('img');image.src='/samples/'+encodeURIComponent(s.file);image.alt=s.prompt;image.loading='lazy';const detail=document.createElement('div');detail.className='detail';const title=document.createElement('h3');title.textContent=s.title;const prompt=document.createElement('p');prompt.textContent=s.prompt;const meta=document.createElement('p');meta.textContent=`${s.width} × ${s.height} · ${s.steps} steps · Seed ${s.seed}`;const link=document.createElement('a');link.href=image.src;link.download=s.file;link.textContent='Download PNG';detail.append(title,prompt,meta,link);article.append(image,detail);$('gallery').append(article);}}catch{}}
gallery();setInterval(gallery,30000);
$('form').addEventListener('submit',async event=>{event.preventDefault();$('submit').disabled=true;const start=Date.now();$('message').textContent='Generating your image…';const ticker=setInterval(()=>{$('message').textContent=`Generating your image… ${Math.floor((Date.now()-start)/1000)}s`;},1000);try{const size=Number($('size').value);const body={prompt:$('prompt').value,width:size,height:size,steps:Number($('steps').value)};if($('seed').value!=='')body.seed=Number($('seed').value);const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const error=await r.json();throw new Error(typeof error.detail==='string'?error.detail:JSON.stringify(error.detail));}const blob=await r.blob();if(resultURL)URL.revokeObjectURL(resultURL);resultURL=URL.createObjectURL(blob);const image=document.createElement('img');image.src=resultURL;image.alt=body.prompt;const link=document.createElement('a');link.href=resultURL;link.download=`qwen-${r.headers.get('X-Seed')}.png`;link.textContent='Download PNG';$('result').replaceChildren(image,link);$('message').textContent=`Ready in ${r.headers.get('X-Generation-Seconds')}s · Seed ${r.headers.get('X-Seed')}`;}catch(error){$('message').textContent=error.message;}finally{clearInterval(ticker);$('submit').disabled=false;refreshStatus();}});
</script>
</body></html>
